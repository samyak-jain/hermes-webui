name: Kumo review image

on:
  push:
    branches:
      - task/t_cabb5252-request-bound-webauthn-integrated

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'samyak-jain/hermes-webui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable reviewed commit image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/samyak-jain/hermes-webui:kumo-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/samyak-jain/hermes-webui
          build-args: HERMES_VERSION=kumo-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: |
          {
            echo '### Kumo review image'
            echo
            echo '`ghcr.io/samyak-jain/hermes-webui@${{ steps.build.outputs.digest }}`'
            echo
            echo 'OCI revision: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
